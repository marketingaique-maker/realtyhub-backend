name: Build static blog pages

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - run: python tools/generate_static.py
      - name: Commit changes
        run: |
          git config user.name "marketingaique-maker"
          git config user.email "marketingaique-maker@users.noreply.github.com"
          git add frontend/blog frontend/sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update static blog pages [skip render]"
            git push
          fi
